<text x="548" y="68" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">PSS/E</text>
<text x="548" y="87" text-anchor="middle" font-size="12" fill="#3a5578">.raw · AC-only</text>
<line x1="132" y1="102" x2="252" y2="131" stroke="#9aa4af" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="340" y1="102" x2="340" y2="131" stroke="#9aa4af" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="548" y1="102" x2="428" y2="131" stroke="#9aa4af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="170" y="134" width="340" height="52" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="340" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">load_case()</text>

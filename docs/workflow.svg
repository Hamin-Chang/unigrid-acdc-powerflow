<text x="340" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Compiled solver</text>
<text x="340" y="260" text-anchor="middle" font-size="12" fill="#656d76">runpf_unigrid_py · Newton-Raphson</text>
<line x1="340" y1="270" x2="340" y2="299" stroke="#9aa4af" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="170" y="302" width="340" height="62" rx="9" fill="#e7f4ec" stroke="#1f8f57" stroke-width="1.5"/>

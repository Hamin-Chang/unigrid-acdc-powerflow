<text x="132" y="87" text-anchor="middle" font-size="12" fill="#3a5578">.xlsx · Hybrid / AC / DC</text>
<rect x="248" y="40" width="184" height="62" rx="9" fill="#e8f0fb" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="340" y="68" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">MATPOWER</text>
<text x="340" y="87" text-anchor="middle" font-size="12" fill="#3a5578">.m · AC-only</text>

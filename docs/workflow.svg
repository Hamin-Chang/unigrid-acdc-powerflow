<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>UniGrid workflow</title>
<desc>Three input formats load through load_case into one compiled solver that runs the auto-detected mode and returns AC, DC, branch, and VSC result tables.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9aa4af" stroke-width="1.4"/></marker></defs>
